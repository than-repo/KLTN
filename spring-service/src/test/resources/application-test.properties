spring.application.name=spring-service

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Flyway for tests (let Hibernate create schema)
spring.flyway.enabled=false

# VNPay Configuration (test values)
vnpay.tmn-code=TEST_TMN_CODE
vnpay.hash-secret=TEST_HASH_SECRET
vnpay.payment-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:3001/payment/vnpay-return

# JWT Configuration for tests
jwt.secret=test-secret-key-for-testing-purposes-only-32chars
jwt.issuer=test-issuer
jwt.audience=test-audience
jwt.access.expires-in=3600
refresh.token.expires-in=86400
refresh.token.max-age-ms=604800000