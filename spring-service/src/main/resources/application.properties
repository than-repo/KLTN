spring.application.name=spring-service

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.config.import=optional:file:./.env.spring[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}

jwt.access.expires-in=${JWT_ACCESS_EXPIRES_IN}
refresh.token.expires-in=${REFRESH_TOKEN_EXPIRES_IN}
refresh.token.max-age-ms=${REFRESH_TOKEN_MAX_AGE_MS}

# SePay Configuration
sepay.environment=sandbox
sepay.merchant-id=${SEPAY_MERCHANT_ID}
sepay.merchant-secret-key=${SEPAY_MERCHANT_SECRET_KEY}
sepay.ipn-secret-key=${SEPAY_IPN_SECRET_KEY}
sepay.checkout-url=https://pay-sandbox.sepay.vn/v1/checkout/init
sepay.success-url=${SEPAY_SUCCESS_URL}
sepay.error-url=${SEPAY_ERROR_URL}
sepay.cancel-url=${SEPAY_CANCEL_URL}
sepay.ipn-url=${SEPAY_IPN_URL}

# Keep column names as-is (database uses camelCase like courseId, not course_id)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Debug logging for Spring Security filter chains
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.security.config.annotation.web=DEBUG