spring.application.name=spring-service

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.config.import=optional:file:./.env.spring[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}

jwt.access.expires-in=${JWT_ACCESS_EXPIRES_IN}
refresh.token.expires-in=${REFRESH_TOKEN_EXPIRES_IN}
refresh.token.max-age-ms=${REFRESH_TOKEN_MAX_AGE_MS}